<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" fill="none">
  <rect width="320" height="260" rx="16" fill="#F8FAFC"/>
  <circle cx="160" cy="130" r="90" fill="#E0F2FE"/>
  <!-- Monitor Stand -->
  <rect x="146" y="176" width="28" height="32" fill="#475569"/>
  <path d="M112 208 H208" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
  <!-- Monitor Frame -->
  <rect x="48" y="54" width="224" height="126" rx="10" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <!-- Screen Display -->
  <rect x="56" y="62" width="208" height="108" rx="4" fill="url(#screenGrad)"/>
  <text x="160" y="122" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="800" font-size="24" letter-spacing="2">4K UHD</text>
  <defs>
    <linearGradient id="screenGrad" x1="56" y1="62" x2="264" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
